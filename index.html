<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18583e">
<title>비품관리대장.xlsx</title><link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="titlebar"><span class="appmark" aria-hidden="true">▦</span><button id="fileName" title="일반 보기 전환 · Esc">비품관리대장.xlsx</button><span class="titlediv"></span><span class="format">통합 문서</span><span class="local" id="localState">로컬 기록</span></header>
<nav class="menus" aria-label="문서 메뉴"><button class="menu active" id="home" aria-pressed="true">홈</button><button class="menu" id="view" aria-pressed="false">보기</button><button class="menu" id="help" aria-expanded="false">도움말</button></nav>
<section class="ribbon" id="ribbonHome" aria-label="홈 도구"><div class="group"><button class="tool" id="restart"><span class="ico sheeticon"></span>새 시트</button><button class="tool" id="cover">일반 보기</button></div><div class="group"><button class="tool" id="memo"><span class="ico noteicon"></span><span id="actionText">메모 열기</span></button><button class="tool" id="drawerTool"><span class="ico drawericon"></span>서랍</button></div><button id="copyTop" class="tool" hidden>결과 복사</button><div class="ribbonhint"><kbd>↑↓←→</kbd> 이동 <kbd>Enter</kbd> 확인 <kbd>Esc</kbd> 일반 보기</div></section>
<section class="ribbon" id="ribbonView" hidden><div class="group"><button class="tool" id="zoomOut">− 축소</button><button class="tool" id="zoomIn">＋ 확대</button></div><button class="tool" id="follow">현재 셀로 이동</button></section>
<section class="ribbon normalTools" id="normalTools" hidden><span>붙여넣기</span><span>맑은 고딕　11</span><span>정렬</span><span>표시 형식　일반</span></section>
<section id="guide" class="guide" hidden>방향키로 이동하고 메모나 참조에서 Enter를 누르세요. 굵은 테두리는 벽입니다. H13에서 마감합니다. Esc 또는 파일명으로 일반 보기를 전환합니다. 숨겨도 검수와 시간은 계속됩니다.</section>
<div class="formula"><span id="address" class="address">A7</span><span class="fx" aria-hidden="true">ƒx</span><output id="formula"></output></div>
<main class="viewport" id="viewport" tabindex="0" aria-label="비품대장">
<table id="sheet" class="sheet" aria-label="비품 관리대장"></table>
<section id="drawerPanel" hidden><div class="drawerheading"><span>총무팀 / 개인 보관 기록</span><h1>비품 서랍</h1><p id="drawerCount"></p></div><table class="collection"><thead><tr><th>품목</th><th>최초 발견 장소</th><th>발견 횟수</th></tr></thead><tbody id="items"></tbody></table><button class="plainbtn" id="back">현재 셀로 이동</button></section>
</main>
<footer><nav class="tabs" aria-label="시트 선택"><span class="tabsign" aria-hidden="true">▤</span><button id="mainTab">비품대장</button><button id="storeTab" disabled>보관실</button><button id="drawerTab">서랍</button><button id="returnTab" hidden>현재 셀</button></nav>
<div class="statusbar"><output id="status" aria-live="polite"></output><span id="progress"></span><span id="zoomtag" class="zoomtag">100%</span><div class="touchline" id="touchline"><button data-key="ArrowLeft" aria-label="왼쪽">←</button><button data-key="ArrowUp" aria-label="위">↑</button><button data-key="ArrowDown" aria-label="아래">↓</button><button data-key="ArrowRight" aria-label="오른쪽">→</button><button data-key="Enter" id="touchAction">확인</button></div></div>
</footer><script type="module" src="./app.js"></script></body></html>
